<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buy me a coffee</title>
    <!--
      The widget injects a stylesheet link to fonts.googleapis.com. The default
      referrer policy would send this document's origin with that request; this
      sends nothing at all. It costs the widget nothing, since the font is
      served to anyone who asks.
    -->
    <meta name="referrer" content="no-referrer" />
    <style>
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!--
      This document exists so that this one script tag has somewhere to run.

      Buy Me a Coffee's button script calls `document.writeln` at parse time, so
      it only works when it is parsed as part of a document's own markup: there
      is no way to hand it to React, and appending it to the DOM after load
      makes it blank the page it lands in. So it gets a document of its own,
      loaded in a sandboxed iframe with no `allow-same-origin`, which means an
      opaque origin: it cannot read this site's `localStorage`, cannot see the
      family line in the parent DOM, and cannot set storage of its own that
      /privacy would then have to account for. See `src/components/CoffeeFrame.tsx`.

      The snippet below is verbatim from Buy Me a Coffee. Do not tidy it, and
      note that `public/` is outside `src/`, so `src/ascii.test.ts` does not
      police it and the coffee character in `data-emoji` survives untouched.
    -->
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="loghomepeople" data-color="#FFDD00" data-emoji="☕"  data-font="Bree" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
  </body>
</html>
